{% set s = summary %}
<div id="mobile-header" {% if oob %}hx-swap-oob="true"{% endif %} class="grid grid-cols-2 gap-3 px-4 pb-3">
  <div class="rounded-2xl bg-emerald-500/10 px-4 py-3 ring-1 ring-emerald-500/30">
    <div class="text-[11px] font-semibold uppercase tracking-wider text-emerald-300/80">En Cuenta</div>
    <div class="mt-0.5 text-2xl font-bold text-emerald-300">{{ s.current | eur }}</div>
  </div>
  <div class="rounded-2xl bg-sky-500/10 px-4 py-3 ring-1 ring-sky-500/30">
    <div class="text-[11px] font-semibold uppercase tracking-wider text-sky-300/80">Proyectado</div>
    <div class="mt-0.5 text-2xl font-bold text-sky-300">{{ s.projected | eur }}</div>
  </div>
  {% if savings_total is not none %}
  <a href="/savings" class="col-span-2 -mt-1 flex items-center justify-between rounded-xl bg-slate-900 px-4 py-1.5 text-xs text-slate-400 ring-1 ring-slate-800">
    <span>🐷 Ahorro apartado</span><span class="font-semibold text-slate-200">{{ savings_total | eur }} ›</span>
  </a>
  {% endif %}
</div>
